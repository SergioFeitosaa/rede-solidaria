# Blueprint do Render: Web Service (Next.js) + Postgres gerenciado.
# No Render: New → Blueprint → selecione este repositório → Apply.
services:
  - type: web
    name: rede-solidaria
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      # Banco: o Render injeta a connection string do Postgres criado abaixo.
      - key: DATABASE_URL
        fromDatabase:
          name: rede-solidaria-db
          property: connectionString
      # Token da Central gerado pelo Render (veja em Environment → Reveal).
      - key: ADMIN_TOKEN
        generateValue: true
      # Preencher manualmente no dashboard após o primeiro deploy.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

databases:
  - name: rede-solidaria-db
    databaseName: rede_solidaria
    user: rede_solidaria
    plan: free
    region: oregon
