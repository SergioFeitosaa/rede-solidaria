name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes automatizados (mínimo 3 do edital)
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
